server {
    listen 80;
    server_name cakra.test;
    
    # Kunci root langsung ke folder public (Otomatis aman & bersih tanpa /public)
    root "C:/laragon/www/cakra/public";
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass php_upstream;        
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}